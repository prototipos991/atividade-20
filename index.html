.toolbar { display:flex; gap:9px; margin-bottom:15px; } .searchbox { flex:1; max-width:390px; display:flex; align-items:center; gap:9px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:0 12px; color:#a2adbb; } .searchbox input { border:0; outline:0; padding:10px 0; width:100%; color:var(--ink); background:transparent; font-size:11px; } .filter-count { color:#fff; background:var(--teal); border-radius:8px; padding:2px 5px; font-size:8px; } .table-card { padding:0; overflow:hidden; } .table-summary { display:flex; justify-content:space-between; padding:17px 20px; border-bottom:1px solid var(--line); color:#8d99aa; font-size:10px; } .table-summary strong { color:var(--ink); } .table-hint { display:flex; gap:5px; align-items:center; color:#1aa483; } .table-scroll { overflow:auto; } table { border-collapse:collapse; width:100%; min-width:780px; } th { text-align:left; padding:13px 20px; background:#fbfcfd; color:#98a3b1; font-size:9px; text-transform:uppercase; letter-spacing:.08em; font-weight:800; } td { padding:13px 20px; border-top:1px solid #f0f2f5; color:#5d6b7f; font-size:10px; } .table-product { display:flex; gap:10px; align-items:center; min-width:190px; } .table-product strong { color:var(--ink); font-size:11px; } .muted-code,.event-id { color:#9aa6b4; font-family:'DM Mono'; font-size:10px; } .unit { color:#a3adba; font-size:9px; } .more-button { color:#9da8b6; padding:5px; cursor:pointer; } .audit-banner { display:flex; align-items:center; gap:12px; padding:13px 16px; background:#e8f8f4; border:1px solid #c7eee7; border-radius:10px; margin-bottom:17px; color:#147d78; } .audit-icon { width:27px; height:27px; display:grid; place-items:center; border-radius:50%; background:#c3eee7; } .audit-banner strong,.audit-banner span { display:block; } .audit-banner strong { font-size:11px; } .audit-banner span { color:#549a95; font-size:9px; margin-top:3px; } .audit-code { margin-left:auto; font-family:'DM Mono'; color:#44958e!important; } .moveme /* ----- Janela "Registrar saída" ----- */
function closeModal() { const m = document.querySelector(".modal-backdrop"); if (m) m.remove(); }

function openExit() {
  const opcoes = products.filter(p => p.status !== "Inativo").map(p => `<option value="${p.id}">${esc(p.name)} · ${p.stock} ${p.unit} disponíveis</option>`).join("");
  root.insertAdjacentHTML("beforeend", `
  <div class="modal-backdrop"><div class="modal" id="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <span class="eyebrow">NOVA MOVIMENTAÇÃO</span>
    <h2>Registrar saída de estoque</h2>
    <p class="modal-sub">Confirme o produto e a quantidade retirada. O registro será criado uma única vez.</p>
    <label>Produto<select id="exitProduct">${opcoes}</select></label>
    <label>Quantidade<input id="exitQty" type="number" min="1" value="1"></label>
    <div class="safe-callout">✓<span><strong>Proteção contra duplicidade</strong><small>Este botão registra somente um evento por confirmação.</small></span></div>
    <button class="primary full" id="exitBtn" onclick="confirmExit()">Confirmar saída ↓</button>
  </div></div>`);
}

function confirmExit() {
  const p = products.find(x => x.id === document.getElementById("exitProduct").value);
  const qty = Number(document.getElementById("exitQty").value);
  if (!p || qty < 1 || qty > p.stock) { alert("Informe uma quantidade válida (entre 1 e " + (p ? p.stock : 0) + ")."); return; }
  document.getElementById("exitBtn").disabled = true; // evita clique duplo
  p.stock -= qty;
  if (p.stock <= p.min) p.status = "Atenção";
  const id = "MOV-" + (1049 + movements.length);
  movements.unshift({ id, product: p.name, type: "Saída", quantity: qty, date: "Agora", responsible: "Marina Costa", status: "Confirmada" });
  successModal("Saída registrada", `O evento foi contabilizado uma única vez e entrou no histórico como <strong>${id}</strong>.`);
}

function successModal(titulo, texto) {
  document.getElementById("modal").innerHTML = `<div class="success-state"><div class="success-icon">✓</div><h2>${titulo}</h2><p>${texto}</p></div>`;
  setTimeout(() => { closeModal(); refresh(); }, 1500);
}

/* =====================================================
   PRODUTOS
   ===================================================== */
function productRows(lista) {
  return lista.map(p => `<tr><td><div class="table-product"><div class="product-avatar">${esc(p.name[0])}</div><strong>${esc(p.name)}</strong></div></td><td class="muted-code">${esc(p.sku)}</td><td>${esc(p.category)}</td><td><strong class="${p.stock <= p.min ? "warning-text" : ""}">${p.stock}</strong> <span class="unit">${p.unit}</span></td><td>${p.min} <span class="unit">${p.unit}</span></td><td>${badge(p.status)}</td><td><button class="more-button">⋯</button></td></tr>`).join("");
}

function productsPage() {
  return `
  <div class="page-heading"><div><span class="eyebrow">CATÁLOGO E INVENTÁRIO</span><h1>Produtos</h1><p>Gerencie itens, estoque mínimo e situação cadastral.</p></div><button class="primary" onclick="openProduct()">＋ Novo produto</button></div>
  <div class="toolbar">
    <div class="searchbox">⌕<input oninput="filterProducts(this.value)" placeholder="Pesquisar por nome, SKU ou categoria..."></div>
    <button class="ghost">⚲ Filtros</button><button class="ghost">⇩ Exportar</button>
  </div>
  <div class="card table-card">
    <div class="table-summary"><span><strong id="productCount">${products.length}</strong> produtos encontrados</span><span class="table-hint">✓ Atualizado há 2 min</span></div>
    <div class="table-scroll"><table><thead><tr><th>Produto</th><th>SKU</th><th>Categoria</th><th>Estoque atual</th><th>Estoque mínimo</th><th>Situação</th><th></th></tr></thead><tbody id="productRows">${productRows(products)}</tbody></table></div>
  </div>`;
}

// Filtra a tabela sem redesenhar a tela inteira (assim o campo de busca não perde o foco)
function filterProducts(q) {
  const lista = products.filter(p => `${p.name} ${p.sku} ${p.category}`.toLowerCase().includes(q.toLowerCase()));
  document.getElementById("productRows").innerHTML = productRows(lista);
  document.getElementById("productCount").textContent = lista.length;
}

function openProduct() {
  root.insertAdjacentHTML("beforeend", `
  <div class="modal-backdrop"><div class="modal" id="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <span class="eyebrow">CADASTRO DE PRODUTO</span>
    <h2>Novo produto</h2>
    <p class="modal-sub">Preencha os dados essenciais para começar a acompanhar o item.</p>
    <label>Nome do produto<input id="newName" placeholder="Ex.: Caixa organizadora"></label>
    <label>Estoque inicial<input id="newStock" type="number" min="0" value="30"></label>
    <div class="safe-callout">✓<span><strong>Validação ativa</strong><small>Nome e estoque inicial são obrigatórios.</small></span></div>
    <button class="primary full" onclick="addProduct()">Salvar produto ✓</button>
  </div></div>`);
}

function addProduct() {
  const name = document.getElementById("newName").value.trim();
  const stock = Number(document.getElementById("newStock").value);
  if (!name || isNaN(stock) || stock < 0) { alert("Preencha o nome e um estoque válido."); return; }
  products.unshift({ id: "p" + Date.now(), name, sku: "NOV-" + String(products.length + 1).padStart(3, "0"), category: "Geral", stock, min: 10, status: "Ativo", sales: 0, unit: "un." });
  successModal("Produto registrado", "O novo item já está disponível na tabela de produtos.");
}

/* =====================================================
   MOVIMENTAÇÕES
   ===================================================== */
function movementsPage() {
  const sinal = t => t === "Saída" ? "↓" : t === "Entrada" ? "↑" : "⚙";
  return `
  <div class="page-heading"><div><span class="eyebrow">RASTREABILIDADE</span><h1>Movimentações</h1><p>Histórico auditável de cada entrada, saída e ajuste.</p></div><button class="ghost">⇩ Exportar relatório</button></div>
  <div class="audit-banner"><div class="audit-icon">✓</div><div><strong>Controle de duplicidade ativo</strong><span>Cada evento possui um ID único e só é contabilizado após confirmação explícita.</span></div><span class="audit-code">Última verificação · agora</span></div>
  <div class="toolbar"><div class="searchbox">⌕<input placeholder="Pesquisar por ID, produto ou responsável..."></div><button class="ghost">⚲ Todos os tipos ⌄</button><button class="ghost">◷ Período ⌄</button></div>
  <div class="card table-card"><div class="table-scroll"><table>
    <thead><tr><th>ID do evento</th><th>Produto</th><th>Tipo</th><th>Quantidade</th><th>Data e hora</th><th>Responsável</th><th>Status</th></tr></thead>
    <tbody>${movements.map(m => `<tr><td><span class="event-id">${m.id}</span></td><td><strong>${esc(m.product)}</strong></td><td><span class="movement-type ${m.type.toLowerCase()}">${sinal(m.type)} ${m.type}</span></td><td><strong>${m.quantity} un.</strong></td><td class="muted-code">${m.date}</td><td><div class="responsible"><div class="avatar-small">${m.responsible.split(" ").map(n => n[0]).join("")}</div>${esc(m.responsible)}</div></td><td>${badge(m.status)}</td></tr>`).join("")}</tbody>
  </table></div></div>`;
}

/* =====================================================
   COMPRAS e REPOSIÇÃO (mesma tela, com pequenas diferenças)
   ===================================================== */
function purchasesPage(repor) {
  const ico = t => t === "done" ? "✓" : t === "route" ? "▱" : "◷";
  return `
  <div class="page-heading">
    <div><span class="eyebrow">${repor ? "PLANEJAMENTO DE COMPRAS" : "PEDIDOS E ENTREGAS"}</span><h1>${repor ? "Reposição necessária" : "Compras"}</h1><p>${repor ? "Itens que precisam de atenção antes de comprometer a operação." : "Acompanhe o que foi comprado e quando chega ao estoque."}</p></div>
    ${repor ? "" : '<button class="primary">＋ Nova compra</button>'}
  </div>
  ${repor ? '<div class="replenish-stats"><div><strong>08</strong><span>itens abaixo do mínimo</span></div><div><strong>03</strong><span>compras sugeridas</span></div><div><strong>R$ 4.820</strong><span>estimativa desta rodada</span></div></div>' : ""}
  <div class="purchase-grid">
    ${purchases.map(p => `<div class="card purchase-card"><div class="purchase-icon ${p.tone}">${ico(p.tone)}</div><div class="purchase-status">${badge(p.status)}</div><h3>${esc(p.name)}</h3><p>${esc(p.supplier)}</p><div class="purchase-meta"><span>▣ ${p.qty}</span><span>◷ ${p.date}</span></div>${repor ? '<button class="primary full">Criar compra 🛒</button>' : '<button class="ghost full">Ver detalhes ↗</button>'}</div>`).join("")}
  </div>
  <div class="card status-guide">
    <div class="card-head"><div><h3>Visão rápida de status</h3><p>O que cada etapa significa no seu fluxo.</p></div></div>
    <div class="guide-row">
      <span class="guide-dot done"></span><div><strong>Recebido</strong><span>Entrada conferida e disponível para uso.</span></div><span class="guide-arrow">→</span>
      <span class="guide-dot route"></span><div><strong>A caminho</strong><span>Pedido confirmado com entrega prevista.</span></div><span class="guide-arrow">→</span>
      <span class="guide-dot wait"></span><div><strong>Aguardando</strong><span>Compra criada, aguardando fornecedor.</span></div>
    </div>
  </div>`;
}

/* Começa pela tela de login */
showLogin();
</script>
</body>
