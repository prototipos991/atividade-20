<body>
<div id="root"></div>
<script>
const seed={products:[{id:'p1',name:'Café em grãos 500g',sku:'CAF-500-01',category:'Alimentos',stock:124,min:40,status:'Ativo',sales:82,unit:'un.'},{id:'p2',name:'Água mineral 500ml',sku:'AGM-500-04',category:'Bebidas',stock:18,min:30,status:'Atenção',sales:146,unit:'fardos'},{id:'p3',name:'Papel toalha interfolhado',sku:'HIG-PT-02',category:'Higiene',stock:52,min:20,status:'Ativo',sales:64,unit:'cx.'},{id:'p4',name:'Detergente neutro 500ml',sku:'LIM-DT-05',category:'Limpeza',stock:0,min:12,status:'Inativo',sales:31,unit:'un.'},{id:'p5',name:'Luva nitrílica M',sku:'EPI-LUV-03',category:'EPI',stock:86,min:35,status:'Ativo',sales:29,unit:'cx.'},{id:'p6',name:'Copo descartável 200ml',sku:'COP-200-08',category:'Descartáveis',stock:11,min:25,status:'Atenção',sales:118,unit:'pct.'}],movements:[{id:'MOV-1048',product:'Café em grãos 500g',type:'Saída',quantity:12,date:'Hoje, 14:32',responsible:'Marina Costa',status:'Confirmada'},{id:'MOV-1047',product:'Água mineral 500ml',type:'Entrada',quantity:30,date:'Hoje, 11:08',responsible:'Rafael Lima',status:'Confirmada'},{id:'MOV-1046',product:'Luva nitrílica M',type:'Ajuste',quantity:4,date:'Ontem, 16:45',responsible:'Marina Costa',status:'Confirmada'},{id:'MOV-1045',product:'Papel toalha interfolhado',type:'Saída',quantity:8,date:'Ontem, 10:12',responsible:'João Pedro',status:'Confirmada'}]};
let data=JSON.parse(localStorage.getItem('logistica-data')||'null')||seed;let page='Visão geral';let registered=false;
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const save=()=>localStorage.setItem('logistica-data',JSON.stringify(data));
const icon={box:'▣',out:'↓',in:'↑',cart:'🛒',warn:'△',check:'✓',truck:'▱',help:'?',clock:'◷',settings:'⚙',menu:'☰',close:'×'};
const status=s=>`<span class="status ${s==='Confirmada'||s==='Recebido'?'ok':s==='Atenção'?'warning':s==='A caminho'?'route':s==='Aguardando'?'waiting':'inactive'}">${esc(s)}</span>`;
function login(){root.innerHTML=`<main class="auth"><section class="auth-art"><div class="brand"><img src="logo.svg"><div class="brand-copy"><strong>Sistema de</strong><span>Logística</span></div></div><div class="auth-copy"><span class="eyebrow">CONTROLE QUE FLUI</span><h1>O estoque no ritmo da sua operação.</h1><p>Organize entradas, saídas e compras em um único lugar — com visibilidade para decidir melhor.</p><div class="metric"><div class="metric-icon">${icon.in}</div><div><strong>98,4%</strong><span>de acuracidade no estoque</span></div></div></div><div class="auth-foot">© 2026 Sistema de Logística · Ambiente interno</div></section><section class="auth-form-wrap"><div class="auth-form"><div class="mobile-brand"><div class="brand"><img src="logo.svg"><div class="brand-copy"><strong>Sistema de</strong><span>Logística</span></div></div></div><div class="auth-heading"><span class="eyebrow">${registered?'NOVO ACESSO':'BEM-VINDO DE VOLTA'}</span><h2>${registered?'Crie sua conta':'Acesse sua operação'}</h2><p>${registered?'Fluxo visual de cadastro do usuário.':'Fluxo visual de autenticação do sistema.'}</p></div><div class="free-wireframe"><span>Área livre para campos de ${registered?'registro':'login'}</span><small>O wireframe não exige preenchimento nesta etapa.</small></div><button class="primary full" onclick="app()">${registered?'Criar conta':'Entrar no sistema'} ↗</button><div class="auth-switch">${registered?'Já tem uma conta?':'Ainda não tem conta?'} <button type="button" class="link" onclick="registered=!registered;login()">${registered?'Fazer login':'Fazer registro'}</button></div><div class="secure">✓ Fluxo demonstrativo · dados não obrigatórios</div></div></section></main>`}
function app({root.innerHTML=`<div class="app"><aside class="sidebar" id="side"><div class="side-top"><div class="brand"><img src="logo.svg"><div class="brand-copy"><strong>Sistema de</strong><span>Logística</span></div></div></div><div class="workspace"><div class="workspace-icon">OP</div><div><strong>Operação principal</strong><span>Estoque central</span></div><b>⌄</b></div><nav class="nav">${[['Visão geral','▦'],['Produtos','▣'],['Movimentações','↓'],['Compras','🛒'],['Reposição','▤']].map(([n,i])=>`<button class="${page===n?'active':''}" onclick="go('${n}')"><span>${i}</span>${n}${n==='Reposição'?'<b class="nav-count">8</b>':''}</button>`).join('')}</nav><div class="side-bottom"><button>♙ Equipe</button><button>⚙ Configurações</button><div class="help">? <div><strong>Precisa de ajuda?</strong><span>Fale com o suporte</span></div></div></div></aside><main class="main"><header class="topbar"><button class="mobile-menu" onclick="side.classList.toggle('open')">☰</button><div class="breadcrumb">Operação principal <b>/</b> <strong>${esc(page)}</strong></div><div class="top-actions"><button class="top-icon">?</button><button class="top-icon">◷<i></i></button><div class="user"><div class="avatar">MC</div><div><strong>Marina Costa</strong><span>Administradora</span></div></div></div></header><div class="content">${page==='Visão geral'?dashboard():page==='Produtos'?products():page==='Movimentações'?movements():purchases(page==='Reposição')}</div></main></div>`}
function go(p){page=p;app()}
function kpi(label,value,helper,ico,tone,trend=''){return `<div class="kpi"><div class="kpi-icon ${tone}">${ico}</div><div class="kpi-top"><span>${label}</span>${trend?`<span class="trend">${trend}</span>`:''}</div><strong>${value}</strong><small>${helper}</small></div>`}
function dashboard(){let needs=data.products.filter(p=>p.status==='Atenção');return `<div class="page-heading"><div><span class="eyebrow">SEGUNDA-FEIRA, 28 DE SETEMBRO DE 2026</span><h1>Bom dia, Marina ✦</h1><p>Aqui está o resumo da sua operação hoje.</p></div><div class="heading-actions"><button class="ghost">⇩ Exportar</button><button class="primary" onclick="exitModal()">↓ Registrar saída</button></div></div><div class="kpis">${kpi('Itens em estoque','1.248','+8,2% vs. mês anterior','▣','teal','+8,2%')}${kpi('Abaixo do mínimo','08','3 itens precisam de compra','△','amber','Atenção')}${kpi('Saídas hoje','64','12 a mais que ontem','↓','blue','+12')}${kpi('Pedidos em trânsito','05','Próxima chegada em 2 dias','▱','violet')}</div><div class="grid2"><div class="card"><div class="head"><div><h3>Movimentação de estoque</h3><p>Entradas e saídas nos últimos 7 dias</p></div><button class="ghost">Últimos 7 dias⌄</button></div><div class="chart"><svg viewBox="0 0 600 220" preserveAspectRatio="none"><path d="M0 166C35 158 55 173 86 134S140 100 171 139S220 151 257 92S306 102 343 119S396 93 429 64S480 89 515 52S560 70 600 28" fill="none" stroke="#20bcae" stroke-width="4"/><path d="M0 182C35 180 58 190 86 168S145 184 171 144S222 168 257 124S307 154 343 140S392 151 429 116S476 132 515 104S560 120 600 94" fill="none" stroke="#9a87e8" stroke-width="4" stroke-dasharray="8 7"/></svg></div><div class="legend"><span><i class="dot t"></i>Entradas</span><span><i class="dot v"></i>Saídas</span><b style="margin-left:auto">Total movimentado 382 un.</b></div></div><div class="card"><div class="head"><div><h3>Requer atenção</h3><p>Produtos abaixo do estoque mínimo</p></div></div><div class="needs">${needs.slice(0,3).map(p=>`<div class="need"><div class="product-avatar">${p.name[0]}</div><div class="need-main"><strong>${esc(p.name)}</strong><span>Atual: <b>${p.stock} ${p.unit}</b> · Mínimo: ${p.min} ${p.unit}</span></div><button class="small-action" onclick="go('Reposição')">Comprar</button></div>`).join('')}<button class="view-all" onclick="go('Reposição')">Ver lista de reposição ↗</button></div></div></div><div class="bottom"><div class="card"><div class="head"><div><h3>Produtos mais vendidos</h3><p>Desempenho por volume de saída</p></div><button class="link" onclick="go('Produtos')">Ver todos ↗</button></div>${[...data.products].sort((a,b)=>b.sales-a.sales).slice(0,4).map((p,i)=>`<div class="rank"><span class="rank-num">0${i+1}</span><strong class="rank-name">${esc(p.name)}</strong><div class="bar-wrap"><div class="bar" style="width:${Math.min(100,p.sales/1.5)}%"></div></div><b class="rank-value">${p.sales} <small>saídas</small></b></div>`).join('')}</div><div class="card"><div class="head"><div><h3>Atividade recente</h3><p>Últimas movimentações registradas</p></div></div>${data.movements.slice(0,3).map(m=>`<div class="activity"><div class="activity-icon ${m.type==='Saída'?'out':'in'}">${m.type==='Saída'?'↓':'↑'}</div><div class="activity-main"><strong>${m.type} · ${esc(m.product)}</strong><span>${m.quantity} un. · ${m.date}</span></div>${status(m.status)}</div>`).join('')}</div></div>`}
function products(){return `<div class="page-heading"><div><span class="eyebrow">CATÁLOGO E INVENTÁRIO</span><h1>Produtos</h1><p>Gerencie itens, estoque mínimo e situação cadastral.</p></div><button class="primary" onclick="productModal()">＋ Novo produto</button></div><div class="toolbar"><div class="search placeholder-search">⌕<span>Área livre para pesquisa de produto</span></div><button class="ghost">⚲ Filtros</button><button class="ghost">⇩ Exportar</button></div><div class="card table-card"><div class="table-summary"><span><strong id="productCount">${data.products.length}</strong> produtos encontrados</span><span style="color:#1aa483">✓ Atualizado há 2 min</span></div><div class="table-scroll"><table><thead><tr><th>Produto</th><th>SKU</th><th>Categoria</th><th>Estoque atual</th><th>Estoque mínimo</th><th>Situação</th></tr></thead><tbody id="productRows">${productRows(data.products)}</tbody></table></div></div>`}
function productRows(arr){return arr.map(p=>`<tr><td><div class="table-product"><div class="product-avatar">${p.name[0]}</div><strong>${esc(p.name)}</strong></div></td><td class="code">${p.sku}</td><td>${p.category}</td><td><strong style="color:${p.stock<=p.min?'#dc9c2b':'inherit'}">${p.stock}</strong> ${p.unit}</td><td>${p.min} ${p.unit}</td><td>${status(p.status)}</td></tr>`).join('')}
function filterProducts(q){let arr=data.products.filter(p=>`${p.name} ${p.sku} ${p.category}`.toLowerCase().includes(q.toLowerCase()));productRowsEl.innerHTML=productRows(arr);productCount.textContent=arr.length}
function movements(){return `<div class="page-heading"><div><span class="eyebrow">RASTREABILIDADE</span><h1>Movimentações</h1><p>Histórico auditável de cada entrada, saída e ajuste.</p></div><button class="ghost">⇩ Exportar relatório</button></div><div class="audit"><span>✓</span><div><strong>Controle de duplicidade ativo</strong><span>Cada evento possui um ID único e só é contabilizado após confirmação explícita.</span></div><span class="audit-code">Última verificação · agora</span></div><div class="toolbar"><div class="search placeholder-search"><span>⌕</span><span>Área livre para pesquisa de movimentações</span></div><button class="ghost">⚲ Todos os tipos⌄</button><button class="ghost">◷ Período⌄</button></div><div class="card table-card"><div class="table-scroll"><table><thead><tr><th>ID do evento</th><th>Produto</th><th>Tipo</th><th>Quantidade</th><th>Data e hora</th><th>Responsável</th><th>Status</th></tr></thead><tbody>${data.movements.map(m=>`<tr><td class="code">${m.id}</td><td><strong>${esc(m.product)}</strong></td><td><b style="color:${m.type==='Saída'?'#d16c75':m.type==='Entrada'?'#16a482':'#8974d2'}">${m.type==='Saída'?'↓':m.type==='Entrada'?'↑':'⚙'} ${m.type}</b></td><td><strong>${m.quantity} un.</strong></td><td class="code">${m.date}</td><td>${esc(m.responsible)}</td><td>${status(m.status)}</td></tr>`).join('')}</tbody></table></div></div>`}
function purchases(replenishment=false){let ps=[['Água mineral 500ml','Distribuidora Nova Era','30 fardos','A caminho','Entrega: 30 set','route'],['Copo descartável 200ml','Atacadão do Brasil','50 pct.','Recebido','Recebido: hoje','ok'],['Detergente neutro 500ml','Limpa Fácil Ltda.','24 un.','Aguardando','Pedido: 27 set','waiting']];return `<div class="page-heading"><div><span class="eyebrow">${replenishment?'PLANEJAMENTO DE COMPRAS':'PEDIDOS E ENTREGAS'}</span><h1>${replenishment?'Reposição necessária':'Compras'}</h1><p>${replenishment?'Itens que precisam de atenção antes de comprometer a operação.':'Acompanhe o que foi comprado e quando chega ao estoque.'}</p></div>${!replenishment?'<button class="primary">＋ Nova compra</button>':''}</div>${replenishment?'<div class="replenish"><div><strong>08</strong><span>itens abaixo do mínimo</span></div><div><strong>03</strong><span>compras sugeridas</span></div><div><strong>R$ 4.820</strong><span>estimativa desta rodada</span></div></div>':''}<div class="purchase-grid">${ps.map(p=>`<div class="card purchase"><div class="purchase-icon ${p[5]}">${p[5]==='ok'?'✓':p[5]==='route'?'▱':'◷'}</div>${status(p[3])}<h3>${p[0]}</h3><p>${p[1]}</p><div class="purchase-meta"><span>▣ ${p[2]}</span><span>◷ ${p[4]}</span></div>${replenishment?'<button class="primary full">Criar compra 🛒</button>':'<button class="ghost full">Ver detalhes ↗</button>'}</div>`).join('')}</div>`}
function closeModal(){document.querySelector('.modal-bg')?.remove()}
function exitModal(){let opts=data.products.filter(p=>p.status!=='Inativo').map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.stock} ${p.unit} disponíveis</option>`).join('');root.insertAdjacentHTML('beforeend',`<div class="modal-bg"><div class="modal"><button class="modal-close" onclick="closeModal()">×</button><span class="eyebrow">NOVA MOVIMENTAÇÃO</span><h2>Registrar saída de estoque</h2><p class="modal-sub">Confirme o produto e a quantidade retirada. O registro será criado uma única vez.</p><div class="free-wireframe compact"><span>Área livre para selecionar produto e quantidade</span><small>Os controles reais entram na próxima etapa do projeto.</small></div><div class="safe">✓ <span><strong>Proteção contra duplicidade</strong><small>Este botão representa a confirmação de um único evento.</small></span></div><button class="primary full" onclick="confirmExit()">Confirmar saída ↓</button></div></div>`)}
function confirmExit(){let p=data.products.find(x=>x.status!=='Inativo'),q=1;if(!p||q<1||q>p.stock){alert('Informe uma quantidade válida.');return}p.stock-=q;if(p.stock<=p.min)p.status='Atenção';data.movements.unshift({id:'MOV-'+(1050+data.movements.length),product:p.name,type:'Saída',quantity:q,date:'Agora',responsible:'Marina Costa',status:'Confirmada'});save();closeModal();app();alert('Saída registrada uma única vez no histórico.')}
function productModal(){root.insertAdjacentHTML('beforeend',`<div class="modal-bg"><div class="modal"><button class="modal-close" onclick="closeModal()">×</button><span class="eyebrow">CADASTRO DE PRODUTO</span><h2>Novo produto</h2><p class="modal-sub">Preencha os dados essenciais para acompanhar o item.</p><div class="free-wireframe compact"><span>Área livre para dados do novo produto</span><small>Nome, categoria e estoque ficam representados sem campos obrigatórios.</small></div><div class="safe">✓ <span><strong>Validação representada</strong><small>O wireframe mostra o estado de confirmação sem exigir preenchimento.</small></span></div><button class="primary full" onclick="addProduct()">Salvar produto ✓</button></div></div>`)}
function addProduct(){let name='Novo produto',stock=30;data.products.unshift({id:'p'+Date.now(),name,sku:'NOV-001',category:'Geral',stock,min:10,status:'Ativo',sales:0,unit:'un.'});save();closeModal();app();alert('Produto registrado com sucesso.')}
login();
</script>
